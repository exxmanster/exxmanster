name: Profile stats

# Recounts the numbers on the profile card once a day.
# Needs the STATS_TOKEN secret: a fine-grained token with read-only
# Contents access to all of your repositories (private ones included).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render stats cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 scripts/stats.py

      - name: Commit if the numbers changed
        run: |
          if git diff --quiet -- assets; then
            echo "Numbers unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Update profile stats"
          git push
